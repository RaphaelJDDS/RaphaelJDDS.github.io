    const now = new Date();

    const standard = "lightmode";
    if(hours < 5 || hours > 19){//nighttime
        standard = "darkmode";
        console.log(standard)
    }
    const mode = saved || standard; // default
    document.documentElement.classList.add(mode);
    })();
