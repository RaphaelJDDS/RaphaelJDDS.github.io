        // Post data comes here. DO NOT FORGET THE GODDAMN COMMAS! The first on the list will appear as the last on the page.
        var data = [
        {
            "title": "A gallery of images made with Stable Diffusion",
            "time": "December 5th, 2:41 Am (GMT), 2023",

        },
        {

            "url": "publications/post5.html",
        }
    ]
    
        // Get the main content div
        var mainContent = document.getElementById('main-content');
    
        // Iterator for each object
        for (var i = data.length -1; i < data.length; i--) {
            var div = document.createElement('div');
            var div = document.createElement('div');
            var title = document.createElement('h1');
            title.className = 'publication-title';
            var a = document.createElement('a');
            a.textContent = data[i].title;
            a.href = data[i].url;
            a.className = 'postslist-title';
            title.appendChild(a);
            var time = document.createElement('p');
            time.textContent = data[i].time;
            time.className = 'publication-title';
            time.id = 'DateAndTime';
            div.appendChild(title);
            div.appendChild(time);
            mainContent.appendChild(div);
        }
        </script>
