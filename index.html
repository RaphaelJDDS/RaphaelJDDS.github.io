        <script defer>
        var renderingTime = 60; // Character rendering time (ms)

        function typeWriter(element, callback) {
        var text = element.textContent;
        var i = 0;

        function type() {
            if (i < text.length) {
            element.textContent = text.slice(0, i+1);
            element.style.visibility = 'visible';
            i++;
            setTimeout(type, renderingTime);
            } else {
            callback();
            }
        }

        type();
        }

        function startAnimation() {
        var paragraphs = Array.from(document.querySelectorAll('.typewriter p'));
        var i = 0;

        function nextParagraph() {
            if (i < paragraphs.length) {
            typeWriter(paragraphs[i], nextParagraph);
            i++;
            }
        }

        nextParagraph();
        }

        window.onload = startAnimation; // Start the animation when the window loads      
        </script>
